services:
  - type: web
    name: gs-podcast-automation
    runtime: python
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SESSION_SECRET
        generateValue: true

      - key: ADMIN_PASSWORD
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
