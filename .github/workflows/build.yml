name: Build Mobile App Package
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source files
        uses: actions/checkout@v4

      - name: Initialize target Python runtime environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize target Flutter Framework compiler engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install system level dependencies
        run: |
          pip install flet bcrypt gtts pydub requests google-generativeai cloudconvert
          flet --version

      - name: Compile application logic to native Android APK format
        run: |
          flet build apk --no-template-downloads

      - name: Archive compiled mobile software package asset
        uses: actions/upload-artifact@v4
        with:
          name: GSPodcast-Android-Installer
          path: build/apk/*.apk
