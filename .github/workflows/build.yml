name: Build Mobile App Package
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
      - name: Install dependencies
        run: pip install flet bcrypt gtts pydub requests google-generativeai cloudconvert
      - name: Build APK
        run: flet build apk --no-template-downloads
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GSPodcast-Android-Installer
          path: build/apk/*.apk
