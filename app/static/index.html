<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS Podcast Studio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f6f9;color:#172033}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #dde2e9;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.wrap{max-width:1400px;margin:auto;padding:22px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #d5dbe4;background:#fff;padding:11px 18px;border-radius:9px}.tab.active{background:#202938;color:#fff}.panel{background:#fff;border:1px solid #dde2e9;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 15px #1620330a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:650;font-size:13px;color:#536074}input,select,textarea{width:100%;border:1px solid #ccd3de;border-radius:9px;padding:11px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#6574cd;box-shadow:0 0 0 3px #6574cd18}textarea{min-height:280px;resize:vertical;line-height:1.55}.btn{border:0;border-radius:9px;padding:11px 16px;background:#263244;color:white}.btn.alt{background:#edf0f5;color:#263244}.btn.green{background:#16794b}.btn.red{background:#b53b48}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.muted{color:#667085;font-size:13px}.status{padding:11px;border-radius:9px;background:#f1f4f8;white-space:pre-wrap}.speakers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.speaker{border:1px solid #e0e5ec;padding:12px;border-radius:10px;background:#fafbfc}.episodes{display:grid;gap:12px}.episode{display:grid;grid-template-columns:130px 1fr auto;gap:15px;border:1px solid #dde2e9;border-radius:12px;padding:13px;align-items:center}.cover{width:130px;height:130px;object-fit:cover;border-radius:10px;background:#202938}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px}.danger{color:#a32635}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(440px,100%);background:white;padding:30px;border-radius:16px;border:1px solid #dde2e9}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:13px 17px;border-radius:10px;z-index:20;max-width:500px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:14px;padding:20px;max-width:700px;width:100%;max-height:85vh;overflow:auto}@media(max-width:900px){.grid,.grid2,.speakers{grid-template-columns:1fr}.episode{grid-template-columns:90px 1fr}.cover{width:90px;height:90px}.top{padding:0 12px}.wrap{padding:12px}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"></div><script>
const $=id=>document.getElementById(id);let state={me:null,settings:{},podcasts:[]};
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),5000)}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let t=await r.text();let j;try{j=JSON.parse(t)}catch{j={detail:t}}if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function boot(){state.me=await api('/api/me');if(!state.me.authenticated)return login();await loadSettings();dashboard()}
function login(){ $('app').innerHTML=`<div class="login"><div class="loginbox"><h1>GS Podcast Studio</h1><p class="muted">AI-powered multi-speaker podcast creation.</p><div class="tabs"><button class="tab active" id="lt">Login</button><button class="tab" id="rt">Register</button></div><div id="authform"></div></div></div>`;authForm('login');$('lt').onclick=()=>authForm('login');$('rt').onclick=()=>authForm('register') }
function authForm(mode){$('authform').innerHTML=`<div class="field"><label>Username</label><input id="au"></div>${mode==='register'?'<div class="field"><label>Email</label><input id="ae" type="email"></div>':''}<div class="field"><label>Password</label><input id="ap" type="password"></div><br><button class="btn" id="authbtn">${mode==='login'?'Login':'Create account'}</button><p id="authmsg" class="muted"></p>`;$('authbtn').onclick=async()=>{try{if(mode==='login'){state.me=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value})});await loadSettings();dashboard()}else{await api('/api/register',{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value,email:$('ae').value}));toast('Account created. Please log in.');authForm('login')}}catch(e){$('authmsg').textContent=e.message}}}
async function loadSettings(){state.settings=await api('/api/settings')}
function dashboard(){ $('app').innerHTML=`<div class="shell"><header class="top"><div class="brand">🎙️ GS Podcast Studio</div><div class="row"><span class="muted">${state.me.username}</span><button class="btn alt" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="tabs"><button class="tab active" data-tab="workspace">Workspace</button><button class="tab" data-tab="settings">AI & Settings</button><button class="tab" data-tab="history">Podcast History</button><button class="tab" data-tab="logs">Logs</button>${state.me.admin?'<button class="tab" data-tab="admin">Admin</button>':''}</div><section id="view"></section></main></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});show('workspace')}
function show(tab){if(tab==='workspace')workspace();if(tab==='settings')settingsView();if(tab==='history')historyView();if(tab==='logs')logsView();if(tab==='admin')adminView()}
function workspace(){let sp='';for(let i=1;i<=4;i++)sp+=`<div class="speaker"><b>Speaker ${i}</b><div class="grid2"><div class="field"><label>Name</label><input id="sn${i}" value="Speaker ${i}"></div><div class="field"><label>Gender</label><select id="sg${i}"><option>Male</option><option>Female</option></select></div></div><div class="field"><label>Voice</label><select id="sv${i}"></select></div></div>`;$('view').innerHTML=`<div class="panel"><div class="row space"><div><h2>Podcast Workspace</h2><p class="muted">Paste a script, article, notes, interview or simply describe the topic.</p></div><button class="btn alt" onclick="clearText()">Clear Text</button></div><div class="field"><label>Source text / topic</label><textarea id="source" placeholder="Paste or type your podcast material here..."></textarea></div><br><div class="row"><button class="btn alt" onclick="rewriteText()">✨ AI Rewrite</button><button class="btn alt" onclick="sampleText()">Load Sample</button></div></div><div class="panel"><h3>Production</h3><div class="grid"><div class="field"><label>Language / voice family</label><select id="lang"><option>English - US</option><option>English - UK</option><option>Swahili - Kenya</option><option>Spanish</option><option>French</option></select></div><div class="field"><label>AI Provider</label><select id="prov"><option>Gemini</option><option>Groq</option><option>OpenRouter Free</option><option>OpenAI</option><option>Ollama Local</option></select></div><div class="field"><label>Model</label><select id="model"></select></div><div class="field"><label>Speakers</label><select id="spcount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div></div><br><div class="grid2"><div class="field"><label>Speech speed</label><input id="speed" type="range" min="0.75" max="1.25" step="0.05" value="1"><span id="speedv">1.00x</span></div><div class="field"><label>Background ambience volume</label><input id="bgvol" type="range" min="0" max="0.30" step="0.01" value="0.10"><span id="bgv">10%</span></div></div></div><div class="panel"><h3>Speakers & Voices</h3><div class="speakers">${sp}</div></div><div class="panel"><h3>Intro / Outro / Export</h3><div class="grid2"><div class="field"><label>Intro text</label><textarea id="intro" style="min-height:120px" placeholder="Welcome to..."></textarea></div><div class="field"><label>Outro text</label><textarea id="outro" style="min-height:120px" placeholder="Thanks for listening..."></textarea></div></div><br><div class="row"><label><input id="bg" type="checkbox" checked> Soft background ambience</label><label><input id="wav" type="checkbox" checked> Export WAV too</label><label><input id="aimeta" type="checkbox" checked> AI title/description</label></div><br><button class="btn green" onclick="generate()">▶ Generate Podcast</button><div id="genstatus" class="status" style="margin-top:12px">Ready.</div></div>`;wireProduction();loadVoiceSelects()}
function clearText(){$('source').value='';$('source').focus()};function sampleText(){$('source').value='Today we explore how small businesses can use automation to save time, improve customer service and make better decisions.'}
function wireProduction(){$('prov').onchange=()=>models();$('lang').onchange=()=>loadVoiceSelects();$('spcount').onchange=()=>{};$('speed').oninput=()=>$('speedv').textContent=(+$('speed').value).toFixed(2)+'x';$('bgvol').oninput=()=>$('bgv').textContent=Math.round(+$('bgvol').value*100)+'%';models()}
function models(){let p=$('prov').value;let m={Gemini:['gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite'],Groq:['openai/gpt-oss-20b','openai/gpt-oss-120b'],'OpenRouter Free':['openrouter/free'],OpenAI:['gpt-5.6-luna','gpt-5.6-terra','gpt-5.6-sol'],'Ollama Local':['llama3.2','qwen2.5:7b','mistral']}[p]||[];$('model').innerHTML=m.map(x=>`<option>${x}</option>`).join('')}
function loadVoiceSelects(){let lang=$('lang').value;let vals=lang==='Swahili - Kenya'?['Male','Female']:['Male','Female'];for(let i=1;i<=4;i++)$('sv'+i).innerHTML=vals.map(g=>`<option>${g} voice</option>`).join('')}
async function rewriteText(){if(!$('source').value.trim())return toast('Enter text first.');try{let j=await api('/api/rewrite',{method:'POST',body:JSON.stringify({text:$('source').value,provider:$('prov').value,model:$('model').value,language:$('lang').value,instruction:'Rewrite into an engaging natural podcast script for the selected number of speakers. Label lines Speaker 1:, Speaker 2:, etc. Keep factual meaning and do not invent sources.'})});$('source').value=j.text;toast('AI rewrite complete.')}catch(e){toast(e.message)}}
async function generate(){let n=+$('spcount').value, names=[],genders=[];for(let i=1;i<=n;i++){names.push($('sn'+i).value||'Speaker '+i);genders.push($('sg'+i).value)}let payload={text:$('source').value,provider:$('prov').value,model:$('model').value,language:$('lang').value,speed:+$('speed').value,speakers:n,speaker_names:names,speaker_genders:genders,intro:$('intro').value,outro:$('outro').value,background:$('bg').checked,background_volume:+$('bgvol').value,export_wav:$('wav').checked,ai_metadata:$('aimeta').checked};$('genstatus').textContent='Generating… AI + voices + mixing + MP3/WAV. This can take a while.';try{let j=await api('/api/generate',{method:'POST',body:JSON.stringify(payload)});$('genstatus').textContent='Created: '+j.title+' ('+(j.duration_ms/1000).toFixed(1)+'s)';toast('Podcast generated successfully.');historyView()}catch(e){$('genstatus').textContent='ERROR: '+e.message;toast(e.message)}}
async function settingsView(){let s=state.settings;$('view').innerHTML=`<div class="panel"><h2>AI Providers & API Keys</h2><p class="muted">Keys stay in your app database. You can paste multiple keys separated by commas or new lines. Never paste real keys into chat.</p><div class="field"><label>Gemini keys</label><textarea id="gk" style="min-height:110px" placeholder="Paste one or more Gemini API keys">${esc(s.gemini_keys)}</textarea></div><br><div class="field"><label>Groq keys</label><textarea id="qk" style="min-height:110px">${esc(s.groq_keys)}</textarea></div><br><div class="field"><label>OpenRouter keys</label><textarea id="rk" style="min-height:110px">${esc(s.openrouter_keys)}</textarea></div><br><div class="field"><label>OpenAI keys</label><textarea id="ok" style="min-height:110px">${esc(s.openai_keys)}</textarea></div><br><div class="field"><label>Ollama URL</label><input id="ou" value="${esc(s.ollama_url||'http://127.0.0.1:11434')}"></div><br><button class="btn green" onclick="saveSettings()">Save All Settings</button></div><div class="panel"><h3>Provider Connection Test</h3><div class="grid"><div class="field"><label>Provider</label><select id="tp"><option>Gemini</option><option>Groq</option><option>OpenRouter Free</option><option>OpenAI</option><option>Ollama Local</option></select></div><div class="field"><label>Model</label><select id="tm"></select></div><div class="field"><label>Optional test key</label><input id="tk" type="password" placeholder="Leave empty to use saved key"></div></div><br><button class="btn" onclick="testAI()">Test Connection</button><div id="testres" class="status" style="margin-top:10px">No test yet.</div></div><div class="panel"><h3>Current free-friendly choices</h3><p class="muted">Gemini supports the current Gemini models listed in the app. Groq and OpenRouter provide additional routes; OpenAI requires an OpenAI API key. Edge TTS is used for speech when available, with gTTS as fallback.</p></div>`;$('tp').onchange=()=>testModels();testModels()}
function testModels(){let p=$('tp').value;let m={Gemini:['gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite'],Groq:['openai/gpt-oss-20b','openai/gpt-oss-120b'],'OpenRouter Free':['openrouter/free'],OpenAI:['gpt-5.6-luna','gpt-5.6-terra','gpt-5.6-sol'], 'Ollama Local':['llama3.2','qwen2.5:7b','mistral']}[p];$('tm').innerHTML=m.map(x=>`<option>${x}</option>`).join('')}
async function saveSettings(){try{await api('/api/settings',{method:'POST',body:JSON.stringify({provider:'Gemini',model:'gemini-3.7-flash',gemini_keys:$('gk').value,groq_keys:$('qk').value,openrouter_keys:$('rk').value,openai_keys:$('ok').value,ollama_url:$('ou').value})});await loadSettings();toast('Settings saved.')}catch(e){toast(e.message)}}
async function testAI(){try{$('testres').textContent='Testing…';let j=await api('/api/test',{method:'POST',body:JSON.stringify({provider:$('tp').value,model:$('tm').value,key:$('tk').value})});$('testres').textContent=(j.ok?'✅ ':'❌ ')+j.detail}catch(e){$('testres').textContent='❌ '+e.message}}
async function historyView(){state.podcasts=await api('/api/podcasts');$('view').innerHTML=`<div class="panel"><div class="row space"><div><h2>Podcast History</h2><p class="muted">Play, download, share, inspect chapters or delete generated episodes.</p></div><button class="btn alt" onclick="historyView()">Refresh</button></div><div class="episodes">${state.podcasts.length?state.podcasts.map(ep=>episode(ep)).join(''):'<p class="muted">No episodes yet.</p>'}</div></div>`}
function episode(e){let chapters='';try{chapters=JSON.parse(e.chapters||'[]')}catch{}return `<div class="episode"><img class="cover" src="/api/media/${encodeURIComponent(e.cover)}"><div><h3>${esc(e.title)}</h3><p>${esc(e.description||'')}</p><div class="small muted">${esc(e.provider)} • ${esc(e.model)} • ${(e.duration_ms/1000).toFixed(1)} sec • ${esc(e.created_at)}</div></div><div class="actions"><button class="btn" onclick="playEp('${e.mp3}')">▶ Play</button><a class="btn alt" href="/api/media/${encodeURIComponent(e.mp3)}" download>MP3</a>${e.wav?`<a class="btn alt" href="/api/media/${encodeURIComponent(e.wav)}" download>WAV</a>`:''}<button class="btn alt" onclick='showChapters(${JSON.stringify(chapters)})'>Chapters</button><button class="btn alt" onclick='shareEp(${JSON.stringify(e.title)},${JSON.stringify(e.mp3)})'>Share</button><button class="btn red" onclick="deleteEp(${e.id})">Delete</button></div></div>`}
function playEp(file){$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="row space"><h3>▶ Now Playing</h3><button class="btn alt" onclick="closeModal()">Close</button></div><audio controls autoplay style="width:100%" src="/api/media/${encodeURIComponent(file)}"></audio></div>`}
function showChapters(c){$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="row space"><h3>Chapter Markers</h3><button class="btn alt" onclick="closeModal()">Close</button></div>${c.map((x,i)=>`<p><b>${fmt(x.start_ms)}</b> — ${esc(x.speaker)}: ${esc(x.title)}</p>`).join('')||'<p>No chapters.</p>'}</div>`}
function shareEp(title,file){let text=encodeURIComponent(title+' — created with GS Podcast Studio');let url=location.origin+'/api/media/'+encodeURIComponent(file);window.open('https://wa.me/?text='+text+'%20'+encodeURIComponent(url),'_blank')}
async function deleteEp(id){if(!confirm('Delete this episode?'))return;await api('/api/podcasts/'+id,{method:'DELETE'});historyView()}
async function logsView(){let x=await api('/api/logs');$('view').innerHTML=`<div class="panel"><h2>Activity Logs</h2>${x.map(a=>`<div class="status" style="margin:7px 0"><b>${esc(a.action)} • ${esc(a.status)}</b><br>${esc(a.details||'')}<br><span class="small muted">${esc(a.created_at)}</span></div>`).join('')||'<p class="muted">No logs.</p>'}</div>`}
async function adminView(){let x=await api('/api/admin/users');$('view').innerHTML=`<div class="panel"><h2>Admin Panel</h2>${x.map(u=>`<div class="status" style="margin:7px 0"><b>${esc(u.username)}</b> — ${esc(u.email||'')} — ${u.active?'ACTIVE':'INACTIVE'} ${u.banned?'BANNED':''}<button class="btn alt" style="float:right" onclick="toggleUser(${u.id})">Toggle Active</button></div>`).join('')}</div>`}
async function toggleUser(id){await api('/api/admin/user/'+id+'/toggle',{method:'POST'});adminView()}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
boot().catch(e=>toast(e.message));
</script></body></html>
